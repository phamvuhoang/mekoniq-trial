<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEKONIQ Serve S1</title>
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="brand.css">
<style>
  /* Hub (spec 4.7): light page that may scroll; hero is the only dark block. */
  .hero { background: var(--deep); color: #fff; padding: 20px 16px 56px; }
  .hero > div { max-width: 1100px; margin: auto; }
  .hero .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 44px; }
  .hero .wordmark span { color: var(--mint); }
  .hero .identity small { color: #9bb6b0; }
  .hero h1 span { color: var(--mint); }
  .hero h1 { font-size: clamp(40px, 7vw, 76px); letter-spacing: -.05em; line-height: 1.02; margin: 0 0 14px; }
  .hero p { color: #bad0ca; max-width: 62ch; margin: 0 0 20px; font-size: 18px; }
  .hero .eyebrow { color: var(--mint); }
  .hero .btn { min-height: 44px; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; }
  .hero .btn:not(.primary) { color: #fff; border-color: #3c5f5c; }
  .hero .row { display: flex; gap: 10px; flex-wrap: wrap; }
  main { max-width: 1100px; margin: auto; padding: 8px 16px 64px; }
  main section { margin-top: 32px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  a.c, .c { display: block; text-decoration: none; padding: 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); min-width: 0; }
  a.c:hover { border-color: var(--green); }
  .c .tag { display: block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; color: var(--green); margin-bottom: 6px; }
  .c h3 { font-size: 18px; margin: 0 0 6px; }
  .c p { font-size: 14px; color: var(--muted); margin: 0; }
  .c.wide { grid-column: 1 / -1; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin-top: 12px; }
  .tgrid a { text-align: center; padding: 12px 0; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; font-weight: 800; background: var(--bg); }
  .tgrid a:hover { border-color: var(--green); }
  ol.script { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14px; }
  ol.script b { color: var(--green); }
  .c .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
</style>
</head><body>
<section class="hero"><div>
  <div class="bar">
    <a class="identity" href="index.html"><img src="logo.svg" alt=""><div><div class="wordmark">MEKONI<span>Q</span></div><small>Intelligence in Motion</small></div></a>
    <a class="btn sm" href="/admin/" style="color:#fff;border-color:#3c5f5c">⚙️ Node-RED</a>
  </div>
  <p class="eyebrow">Serve S1 · Demo vận hành</p>
  <h1>Mọi màn hình, <span>một chỗ.</span></h1>
  <p>Robot giao món, đồ uống và thu dọn bàn — điều phối từ nhiều trạm, có hàng chờ, huỷ an toàn, cảnh báo và nhật ký vận hành.</p>
</div></section>
<main id="hub"></main>
<script src="transport.js"></script><script src="common.js"></script>
<script>
const DESC = { bep: 'Giao món ra bàn, gọi robot về bếp', bar: 'Giao đồ uống từ quầy', don: 'Gọi robot thu dọn, mang chén về khu rửa', ql: 'Giám sát đội robot, xử lý sự cố' };
const card = (href, tag, title, desc) => `<a class="c" href="${href}" target="_blank"><span class="tag">${esc(tag)}</span><h3>${esc(title)} ↗</h3><p>${esc(desc)}</p></a>`;
const group = (title, cards) => `<section><p class="eyebrow">${esc(title)}</p><div class="cards">${cards}</div></section>`;
connect(m => {
  if (m.type !== 'site') return;
  const S = App.site, tables = Object.keys(S.points).filter(k => S.points[k].kind === 'table');
  const t0 = S.points.T05 ? 'T05' : tables[0];
  document.getElementById('hub').innerHTML =
    group('Máy trạm nhân viên', S.roles.map(r => card(`station.html?role=${encodeURIComponent(r.id)}`, 'Nhân viên', r.name, DESC[r.id] || 'Máy trạm theo vai trò')).join('')
      + card('station.html?role=ql&view=mon', 'Quản lý', 'Giám sát & sơ đồ', 'Sơ đồ nhà hàng, robot, cảnh báo và nhật ký')) +
    group('Màn hình trên robot', S.robots.map(r => card(`robot.html?robot=${encodeURIComponent(r.id)}`, 'Khách & nhân viên', 'Robot ' + r.id, 'Tablet gắn trên robot')).join('')) +
    group('Khách hàng', (t0 ? card(`table.html?t=${encodeURIComponent(t0)}`, 'Khách hàng · QR tại bàn', pname(t0) + ' · Theo dõi món', 'Trang khách quét QR: xem tiến độ, huỷ món') : '')
      + `<div class="c wide"><span class="tag">Chọn số bàn</span><div class="tgrid">${tables.map(t => `<a href="table.html?t=${encodeURIComponent(t)}" target="_blank">${esc(short(t))}</a>`).join('')}</div></div>`) +
    // Cấu hình is needed on real (Valetudo) sites too; only the route designer needs the simulator.
    group('Cấu hình', card('setup.html', 'Quản lý', 'Cấu hình', 'Bàn, trạm, điểm dừng, vai trò, thời gian, sao lưu')
      + (hasSim() ? card('map.html', 'Quản lý', 'Thiết kế lộ trình', 'Lối đi, lối hẹp, một chiều, đóng lối (robot giả lập)') : ''));
});
</script>
</body></html>
